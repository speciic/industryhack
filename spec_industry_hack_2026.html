<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="SPEC INDUSTRY HACK 2026: National 24-Hour College Hackathon organized by St. Peter's Engineering College in collaboration with GeeksforGeeks Student Chapter & Spectrum Circle. ₹1,00,000 Prize Pool. August 1–2, 2026." />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons UMD -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-blueprint: #0E2A4A;
      --bg-panel: #123A63;
      --bg-dark-panel: #091C33;
      
      --line-white: #EAF2FA;
      --line-dim: rgba(234, 242, 250, 0.25);
      
      --accent-signal: #FFB800;
      --accent-stamp: #E8483C;
      
      --text-bright: #FFFFFF;
      --text-dim: #9FB8D4;
      --text-muted: #6B8BAE;
      
      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Floating Particles Colors */
      --particle-color-0: #FFB800; /* Safety Yellow */
      --particle-color-1: #E8483C; /* Stamp Red */
      --particle-color-2: #EAF2FA; /* White Ink drafting line */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 120px;
      background-color: var(--bg-blueprint);
      color: var(--text-dim);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
    }

    body {
      overflow-x: hidden;
      background-color: var(--bg-blueprint);
      color: var(--text-dim);
      padding-top: 5.5rem;
    }

    .bg-blueprint-grid {
      background-color: var(--bg-blueprint);
      background-image: 
        linear-gradient(to right, rgba(234, 242, 250, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(234, 242, 250, 0.07) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    :focus-visible {
      outline: 2px solid var(--accent-signal);
      outline-offset: 4px;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-display);
      color: var(--text-bright);
      line-height: 1.25;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    .font-display {
      font-family: var(--font-display);
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    .nav-glassmorphism {
      background-color: rgba(14, 42, 74, 0.65) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(234, 242, 250, 0.25) !important;
      box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.45);
      border-radius: 9999px !important;
    }

    .blueprint-title-block {
      background-color: var(--bg-dark-panel);
      border: 2px solid var(--line-white);
      padding: 1rem 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--line-white);
      position: relative;
    }



    .btn-illuminated {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background-color: var(--accent-signal);
      color: var(--bg-blueprint) !important;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.8rem 1.85rem;
      border-radius: 0px;
      border: 2px solid var(--accent-signal);
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 0 0 3px var(--bg-blueprint), 0 0 0 5px var(--line-white);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      animation: signalBlink 2.5s infinite steps(1);
      position: relative;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-illuminated:hover {
      background-color: #FFCA28;
      transform: translateY(-2px);
      box-shadow: 0 0 0 2px var(--bg-blueprint), 0 0 0 4px var(--accent-signal);
    }

    .btn-illuminated:active {
      transform: translateY(0);
      box-shadow: 0 0 0 2px var(--bg-blueprint), 0 0 0 3px var(--accent-signal);
    }

    .btn-illuminated-lg {
      padding: 1rem 2.25rem;
      font-size: 1.05rem;
    }

    @keyframes signalBlink {
      0%, 100% {
        box-shadow: 0 0 0 3px var(--bg-blueprint), 0 0 0 5px var(--line-white);
      }
      50% {
        box-shadow: 0 0 0 3px var(--bg-blueprint), 0 0 0 5px var(--accent-signal);
      }
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background-color: transparent;
      color: var(--text-bright);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.8rem 1.85rem;
      border-radius: 0px;
      border: 1px solid var(--line-white);
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .btn-ghost:hover {
      background-color: var(--bg-panel);
      border-color: var(--accent-signal);
      color: var(--accent-signal);
    }

    .btn-ghost-lg {
      padding: 1rem 2.25rem;
      font-size: 1.05rem;
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-stamp);
      background-color: rgba(232, 72, 60, 0.1);
      border: 1px solid var(--accent-stamp);
      padding: 0.35rem 0.85rem;
      border-radius: 0px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: clamp(1.85rem, 4vw, 2.75rem);
      font-weight: 800;
      color: var(--text-bright);
      margin-bottom: 1rem;
    }

    .section-subtitle {
      font-size: 1.05rem;
      color: var(--text-dim);
      max-width: 680px;
    }

    .tech-card {
      background-color: var(--bg-panel);
      border: 1px solid var(--line-dim);
      border-radius: 0px;
      padding: 1.75rem;
      transition: border-color 0.2s ease, background-color 0.2s ease;
      position: relative;
    }

    .tech-card:hover {
      border-color: var(--line-white);
      background-color: #164373;
    }

    .rubber-stamp {
      display: inline-block;
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 0.8rem;
      color: var(--accent-stamp);
      border: 2px solid var(--accent-stamp);
      padding: 0.4rem 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      transform: rotate(-8deg);
      box-shadow: 0 0 0 2px var(--bg-blueprint);
      user-select: none;
    }

    /* Floating Particles Core Styling */
    #particles-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      bottom: -5%;
      width: var(--width);
      height: var(--width);
      border-radius: 50%;
      opacity: 0;
      transform-origin: center;
      will-change: transform, opacity;
      animation-name: floatUp;
      animation-duration: var(--duration);
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-delay: var(--delay);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      20% {
        opacity: var(--max-opacity);
      }
      80% {
        opacity: var(--max-opacity);
      }
      100% {
        transform: translateY(-110vh) scale(0.5);
        opacity: 0;
      }
    }

    .particle[data-color-type="0"] {
      background-color: var(--particle-color-0);
      box-shadow: 0 0 calc(var(--width) * 2) var(--particle-color-0);
    }
    .particle[data-color-type="1"] {
      background-color: var(--particle-color-1);
      box-shadow: 0 0 calc(var(--width) * 2) var(--particle-color-1);
    }
    .particle[data-color-type="2"] {
      background-color: var(--particle-color-2);
      box-shadow: 0 0 calc(var(--width) * 2) var(--particle-color-2);
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .btn-illuminated {
        animation: none !important;
      }
      /* Exclude background particles from visual freezes so they animate consistently */
      .particle {
        animation-name: floatUp !important;
        animation-duration: var(--duration) !important;
        animation-iteration-count: infinite !important;
        animation-delay: var(--delay) !important;
        transform: none;
        opacity: unset;
      }
      /* Exclude marquee from visual freezes so it always scrolls */
      .marquee-content {
        animation-name: scroll-left !important;
        animation-duration: 25s !important;
        animation-iteration-count: infinite !important;
      }
    }

    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Seamless Marquee Animation */
    .marquee-container {
      mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
    }
    
    .marquee-content {
      animation: scroll-left 25s linear infinite;
    }
    
    .marquee-container:hover .marquee-content {
      animation-play-state: paused;
    }
    
    @keyframes scroll-left {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
  </style>
</head>
<body class="bg-blueprint-grid">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const clubLogos = [
      'assets/1.png', 'assets/2.png', 'assets/3.png', 'assets/4.png',
      'assets/5.png', 'assets/6.png', 'assets/7.png', 'assets/8.png',
      'assets/9.png', 'assets/10.png', 'assets/11.png', 'assets/12.png',
      'assets/13.png', 'assets/14.png', 'assets/15.png', 'assets/16.png',
      'assets/17.jpeg', 'assets/18.jpeg'
    ];

    const FORM_LINK = "https://forms.gle/REPLACE_WITH_ACTUAL_FORM_LINK";

    function ParticleBackground() {
      useEffect(() => {
        const container = document.getElementById('particles-container');
        if (!container) return;

        container.innerHTML = ''; // Hot-reload/re-render safety

        const particleCount = 65;
        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';

          const size = Math.random() * 5 + 2; // 2px to 7px
          const duration = Math.random() * 15 + 15; // 15s to 30s
          const delay = -(Math.random() * duration);
          const maxOpacity = Math.random() * 0.3 + 0.1; // 0.1 to 0.4
          const left = Math.random() * 100;
          const colorType = Math.floor(Math.random() * 3); // 0, 1, 2

          particle.style.setProperty('--width', `${size}px`);
          particle.style.setProperty('--duration', `${duration}s`);
          particle.style.setProperty('--delay', `${delay}s`);
          particle.style.setProperty('--max-opacity', maxOpacity);
          particle.style.left = `${left}%`;
          particle.setAttribute('data-color-type', colorType.toString());

          container.appendChild(particle);
        }
      }, []);

      return <div id="particles-container" />;
    }

    function App() {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [activeTimelineDay, setActiveTimelineDay] = useState(1);
      const [openFaq, setOpenFaq] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [mobileMenuOpen, activeTimelineDay, openFaq]);

      const toggleFaq = (index) => {
        setOpenFaq(openFaq === index ? null : index);
      };

      return (
        <div className="bg-blueprint-grid min-h-screen text-[#9FB8D4] selection:bg-[#FFB800] selection:text-[#0E2A4A] relative">
          
          {/* Background Particles System */}
          <ParticleBackground />

            <div className="px-6 sm:px-8 flex items-center h-12 md:h-14">
              
              {/* Logo Mark (Left aligned) */}
              <div className="flex-1 flex justify-start">
                <a href="#" className="flex items-center gap-3 text-white font-display font-bold text-xs md:text-sm tracking-tight no-underline group">
                  <img src="assets/spec.jpeg" alt="SPEC Logo" className="w-8 h-8 md:w-10 md:h-10 object-contain rounded-md" />
                  <div className="flex flex-col">
                    <span className="leading-none text-white font-extrabold text-xs md:text-sm tracking-wider">SPEC INDUSTRY HACK</span>
                    <span className="text-[8px] md:text-[9px] font-mono text-[#E8483C] tracking-widest mt-0.5 uppercase">[DWG: SIH-2026]</span>
                  </div>
                </a>
              </div>

              {/* Desktop Nav Links (Centered in the middle of navbar) */}
              <nav className="hidden lg:flex items-center justify-center gap-6 font-display text-[10px] md:text-[11px] font-bold tracking-widest uppercase">
                <a href="#about" className="text-[#9FB8D4] hover:text-white transition-colors no-underline">About</a>
                <a href="#themes" className="text-[#9FB8D4] hover:text-white transition-colors no-underline">Themes</a>
                <a href="#structure" className="text-[#9FB8D4] hover:text-white transition-colors no-underline">Structure</a>
                <a href="#timeline" className="text-[#9FB8D4] hover:text-white transition-colors no-underline">Timeline</a>
                <a href="#prizes" className="text-[#9FB8D4] hover:text-white transition-colors no-underline">Prizes</a>

                <a href="#clubs" className="text-[#9FB8D4] hover:text-white transition-colors no-underline">Clubs</a>
                <a href="#faq" className="text-[#9FB8D4] hover:text-white transition-colors no-underline">FAQ</a>
              </nav>

              {/* Desktop Illuminated CTA Container / Mobile toggle (Right aligned) */}
              <div className="flex-1 flex justify-end items-center gap-4">
                <div className="hidden lg:flex items-center shrink-0">
                  <a
                    href={FORM_LINK}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="btn-illuminated py-1.5 px-4 text-[10px] tracking-wider rounded-full"
                  >
                    <span>Register Now</span>
                    <i data-lucide="arrow-up-right" className="w-3 h-3"></i>
                  </a>
                </div>

                {/* Mobile Menu Toggle Button */}
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}

                >
                  <i data-lucide={mobileMenuOpen ? "x" : "menu"} className="w-4 h-4"></i>
                </button>
              </div>
            </div>

            {mobileMenuOpen && (
              <div className="lg:hidden bg-[#0E2A4A]/95 backdrop-blur-xl border border-[#EAF2FA]/20 mt-2 px-6 py-6 flex flex-col gap-4 font-display text-sm font-bold tracking-wider uppercase rounded-2xl shadow-xl">
                <a href="#about" onClick={() => setMobileMenuOpen(false)} className="text-white hover:text-[#FFB800] py-1 no-underline">About</a>
                <a href="#themes" onClick={() => setMobileMenuOpen(false)} className="text-white hover:text-[#FFB800] py-1 no-underline">Themes</a>
                <a href="#structure" onClick={() => setMobileMenuOpen(false)} className="text-white hover:text-[#FFB800] py-1 no-underline">Structure</a>
                <a href="#timeline" onClick={() => setMobileMenuOpen(false)} className="text-white hover:text-[#FFB800] py-1 no-underline">Timeline</a>
                <a href="#prizes" onClick={() => setMobileMenuOpen(false)} className="text-white hover:text-[#FFB800] py-1 no-underline">Prizes</a>
                <a href="#partners" onClick={() => setMobileMenuOpen(false)} className="text-white hover:text-[#FFB800] py-1 no-underline">Partners</a>
                <a href="#clubs" onClick={() => setMobileMenuOpen(false)} className="text-white hover:text-[#FFB800] py-1 no-underline">Clubs</a>
                <a href="#faq" onClick={() => setMobileMenuOpen(false)} className="text-white hover:text-[#FFB800] py-1 no-underline">FAQ</a>
                <div className="pt-2">
                  <a
                    href={FORM_LINK}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="btn-illuminated w-full text-center justify-center rounded-full"
                  >
                    <span>Register Now</span>
                    <i data-lucide="arrow-up-right" className="w-4 h-4"></i>
                  </a>
                </div>
              </div>
            )}
          </header>

          {/* 2. HERO SECTION */}
          <section className="relative pt-12 md:pt-16 pb-16 md:pb-24 border-b border-[#EAF2FA]/20 overflow-hidden">
            <div className="container relative z-10">
              
              {/* Presents Line */}
              <div className="text-xs sm:text-sm font-mono text-[#FFB800] uppercase tracking-[0.25em] mb-3 select-none text-center">
                SPEC-IIC PRESENTS
              </div>

              <h1 className="text-4xl sm:text-6xl lg:text-7xl font-extrabold text-white font-display tracking-wider leading-[1.08] max-w-5xl mx-auto text-center mb-6">
                SPEC INDUSTRY HACK <span className="text-[#FFB800]">2026</span>
              </h1>

              <p className="text-xl sm:text-2xl font-display font-bold text-[#FFFFFF] max-w-3xl mx-auto text-center mb-4 tracking-wide">
                &ldquo;Industry Challenges, Innovative Solutions, Incredible Impact.&rdquo;
              </p>

              <p className="text-base text-[#9FB8D4] max-w-3xl mx-auto text-center mb-10 leading-relaxed">
                Organized by <strong className="text-white font-semibold">St. Peter&apos;s Engineering College</strong>, in collaboration with <strong className="text-[#FFB800]">GeeksforGeeks Student Chapter</strong> &amp; <strong className="text-[#E8483C]">Spectrum Circle</strong>.
              </p>

              <div className="flex flex-wrap items-center justify-center gap-4 mb-10 text-xs font-mono">
                <div className="flex items-center gap-2.5 px-4 py-2.5 bg-[#123A63] border border-[#EAF2FA]/30 rounded-none text-[#FFFFFF]">

                  <span>1st–2nd August 2026</span>
                </div>
                <div className="flex items-center gap-2.5 px-4 py-2.5 bg-[#123A63] border border-[#EAF2FA]/30 rounded-none text-[#FFFFFF]">
                  <i data-lucide="map-pin" className="w-4 h-4 text-[#FFB800]"></i>
                  <span>St. Peter&apos;s Engineering College Campus</span>
                </div>
              </div>

              <div className="flex flex-wrap items-center justify-center gap-6 mb-16">
                <a href={FORM_LINK} target="_blank" rel="noopener noreferrer" className="btn-illuminated btn-illuminated-lg">
                  <span>Register Now</span>
                  <i data-lucide="arrow-up-right" className="w-5 h-5"></i>
                </a>
                <a href="#themes" className="btn-ghost btn-ghost-lg">
                  <span>Explore Themes</span>
                  <i data-lucide="chevron-right" className="w-5 h-5 text-[#9FB8D4]"></i>
                </a>
              </div>

              <div className="pt-8 border-t border-[#EAF2FA]/20">
                <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                  <div className="p-4 bg-[#123A63] border border-[#EAF2FA]/30 rounded-none relative">
                    <div className="text-2xl sm:text-3xl font-extrabold font-display text-white">24+</div>
                    <div className="text-xs font-mono text-[#9FB8D4] mt-1">Hours Non-Stop</div>
                    <div className="mt-3 pt-2 border-t border-[#EAF2FA]/20 text-[10px] font-mono text-[#6B8BAE]">
                      ◄── DURATION ──►
                    </div>
                  </div>

                  <div className="p-4 bg-[#123A63] border border-[#EAF2FA]/30 rounded-none relative">
                    <div className="text-2xl sm:text-3xl font-extrabold font-display text-[#FFB800]">1000+</div>
                    <div className="text-xs font-mono text-[#9FB8D4] mt-1">Participants</div>
                    <div className="mt-3 pt-2 border-t border-[#EAF2FA]/20 text-[10px] font-mono text-[#6B8BAE]">
                      ◄── CAPACITY ──►
                    </div>
                  </div>

                  <div className="p-4 bg-[#123A63] border border-[#EAF2FA]/30 rounded-none relative">

                    <div className="mt-3 pt-2 border-t border-[#EAF2FA]/20 text-[10px] font-mono text-[#6B8BAE]">
                      ◄── SQUADS ──►
                    </div>
                  </div>

                  <div className="p-4 bg-[#123A63] border border-[#EAF2FA]/30 rounded-none relative">
